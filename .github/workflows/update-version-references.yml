---
name: Update Version References and Version Page

on:
  release:
    types: [published]

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release version
        id: get_version
        run: echo "VERSION=$(gh release view --json tagName --jq .tagName)" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List available versions
        id: list_versions
        run: |
          FR_VERSIONS=$(ls version/fr | grep -E '^[0-9]+\.[0-9]+\.md$' | sed 's/\.md//g' | sort -V | while read -r v; do echo "- [v${v}](version/fr/${v}.md)"; done)
          EN_VERSIONS=$(ls version/en | grep -E '^[0-9]+\.[0-9]+\.md$' | sed 's/\.md//g' | sort -V | while read -r v; do echo "- [v${v}](version/en/${v}.md)"; done)
          echo "FR_VERSIONS<<DELIMITER" >> $GITHUB_ENV
          echo "$FR_VERSIONS" >> $GITHUB_ENV
          echo "DELIMITER" >> $GITHUB_ENV
          echo "EN_VERSIONS<<DELIMITER" >> $GITHUB_ENV
          echo "$EN_VERSIONS" >> $GITHUB_ENV
          echo "DELIMITER" >> $GITHUB_ENV

      - name: Update version/fr/latest.md
        run: |
          cat > version/fr/latest.md << EOF
          # Dernière version de la Licence LSNC (Français)

          La dernière version de la Licence LibreShare Non-Commerciale est la **[LSNC v${VERSION}](version/fr/${VERSION}.md)**. Consultez la page [Versions](version.md) pour toutes les versions disponibles.

          - [Voir la licence complète](https://github.com/Lameur/SLNC-License/releases/tag/v${VERSION})
          - [Télécharger le fichier de licence](https://raw.githubusercontent.com/Lameur/SLNC-License/v${VERSION}/version/fr/${VERSION}.md)
          EOF

      - name: Update version/en/latest.md
        run: |
          cat > version/en/latest.md << EOF
          # Latest Version of the LSNC License (English)

          The latest version of the LibreShare Non-Commercial License is **[LSNC v${VERSION}](version/en/${VERSION}.md)**. See the [Versions](version.md) page for all available versions.

          - [View the full license](https://github.com/Lameur/SLNC-License/releases/tag/v${VERSION})
          - [Download the license file](https://raw.githubusercontent.com/Lameur/SLNC-License/v${VERSION}/version/en/${VERSION}.md)
          EOF

      - name: Update version.md
        run: |
          cat > version.md << EOF
          # LSNC Versions

          Below is a list of all available versions of the LibreShare Non-Commercial License (LSNC).

          ## French
          ${{ env.FR_VERSIONS }}

          ## English
          ${{ env.EN_VERSIONS }}

          *Note*: This page is automatically updated when new versions are released.
          EOF

      - name: Update index.md
        run: |
          cat > index.md << EOF
          # LibreShare Non-Commercial License (LSNC)

          Welcome to the official home of the **LibreShare Non-Commercial License (LSNC)** at [https://lameur.github.io/LSNC-License](https://lameur.github.io/LSNC-License). This open-source license, designed to balance free software principles with proprietary protection, is ideal for developers and organizations.

          ## About the LSNC

          The LSNC is a versatile open-source license that balances the principles of free software with the protection of proprietary elements, such as non-open-source compilers. It is ideal for developers.

          ### Key Features

          - **Non-Commercial Use**: Authorized, including for educational purposes (e.g., schools, universities, training).
          - **Copyleft**: Derivative works must be shared under the same license with source code.
          - **Protection of Compiled Versions**: Reverse engineering is prohibited to safeguard proprietary elements.
          - **Flexibility**: Users can request permissions for specific uses (e.g., commercial).

          ## Navigation

          - [Versions](version.md): List of all available LSNC versions.
          - [Usage Guide](docs/usage.md): How to apply the LSNC to your project.
          - [FAQ](docs/faq.md): Answers to common questions about the license.

          ## Contact

          For questions, permission requests (e.g., for commercial use), or inquiries about compatibility with other licenses, contact:

          - **Email**: [lameur.tech@gmail.com](mailto:lameur.tech@gmail.com)
          - **GitHub**: [github.com/Lameur](https://github.com/Lameur)

          *Note*: Contact information will be updated once the official website is available.

          ## Contribute

          We welcome suggestions to improve the LSNC! Open an [issue](https://github.com/Lameur/SLNC-License/issues) or submit a [pull request](https://github.com/Lameur/SLNC-License/pulls) on [GitHub](https://github.com/Lameur/SLNC-License).
          ---
          EOF

      - name: Commit changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add version/fr/latest.md
          git add version/en/latest.md
          git add version.md
          git add index.md
          git add docs/usage.md
          git add docs/faq.md
          git commit -m "Update version references and version.md for release v${VERSION}"
          git push